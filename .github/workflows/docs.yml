name: Publish Docs
on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "mkdocs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "mkdocs.yml"
permissions:
  contents: read
jobs:
  # On pull requests: build only, failing on broken links or nav entries.
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Build (strict)
        run: >-
          uv run --no-project --with "mkdocs>=1.5.0" --with "mkdocs-material>=9.5.0"
          --with "pymdown-extensions>=10.20" mkdocs build --strict

  deploy:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write  # gh-deploy pushes to the gh-pages branch
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Install dependencies
        run: uv sync --group docs
      - name: Configure Git Credentials
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
      - name: Deploy
        run: uv run mkdocs gh-deploy --force
